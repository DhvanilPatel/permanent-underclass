name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo clippy (strict)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo test (lib)
        run: cargo test --lib

      - name: Cargo test (sim)
        run: cargo test --test sim

  security-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Secret pattern scan
        run: |
          set -euo pipefail
          if rg -n --hidden -S '(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|npm_[A-Za-z0-9]{36,}|//registry\.npmjs\.org/:_authToken=[A-Za-z0-9._-]{20,}|(CF_API_TOKEN|CLOUDFLARE_API_TOKEN|CLOUDFLARE_TOKEN)[=:]["'"'"']?[A-Za-z0-9._-]{20,}|X-Auth-Key:[[:space:]]*[A-Za-z0-9._-]{20,}|-----BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY-----)' . \
            -g '!.git/**' -g '!target/**' -g '!node_modules/**' -g '!.venv/**' -g '!.venv-tools/**'; then
            echo \"Potential secret pattern detected\" >&2
            exit 1
          fi

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Cargo audit
        run: timeout 180 cargo audit

      - name: Cargo deny (advisories)
        run: cargo deny check advisories

      - name: Gitleaks scan
        uses: DariuszPorowski/github-action-gitleaks@v2
        with:
          config: .gitleaks.toml
          no_git: true
          fail: true
          redact: true
          verbose: true

      - name: npm audit (prod)
        run: npm audit --omit=dev
