name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo clippy (strict)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Cargo test (lib)
        run: cargo test --locked --lib --test content_schema

      - name: Cargo test (sim)
        run: cargo test --locked --test sim

  security-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Secret pattern scan
        run: |
          set -euo pipefail
          if rg -n --hidden -S '(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|npm_[A-Za-z0-9]{36,}|//registry\.npmjs\.org/:_authToken=[A-Za-z0-9._-]{20,}|(CF_API_TOKEN|CLOUDFLARE_API_TOKEN|CLOUDFLARE_TOKEN)[=:]["'"'"']?[A-Za-z0-9._-]{20,}|X-Auth-Key:[[:space:]]*[A-Za-z0-9._-]{20,}|-----BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY-----)' . \
            -g '!.git/**' -g '!target/**' -g '!node_modules/**' -g '!.venv/**' -g '!.venv-tools/**'; then
            echo \"Potential secret pattern detected\" >&2
            exit 1
          fi

      - name: Install cargo-audit
        uses: taiki-e/install-action@8b0909b8902031c9ed62abc2387ebd6120876869 # cargo-audit
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@7ff3827688bd742ffc0b597ab1bf503967134e46 # cargo-deny
        with:
          tool: cargo-deny

      - name: Cargo audit
        run: timeout 180 cargo audit

      - name: Cargo deny (advisories)
        run: cargo deny check advisories

      - name: Gitleaks scan
        uses: DariuszPorowski/github-action-gitleaks@a027585cb1f2780aa441f20f4d0aabf8b1a0d90e # v2
        with:
          config: .gitleaks.toml
          no_git: true
          fail: true
          redact: true
          verbose: true

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: npm audit (including build tools)
        run: npm audit --audit-level=high
