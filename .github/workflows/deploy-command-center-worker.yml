name: Deploy Command Center Worker

on:
  push:
    branches: [main]
    paths:
      - 'apps/command-center/**'
      - 'data/**'
      - 'scripts/copy_command_center_worker_data.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-command-center-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-command-center-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Validate Cloudflare auth config
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing Cloudflare API token secret. Set CF_API_TOKEN or CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing Cloudflare account id secret. Set CF_ACCOUNT_ID or CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          npx --no-install wrangler whoami

      - name: Deploy Worker
        run: npm run deploy:command-center:worker
